<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banque de Cours</title>
    <style>
        :root {
            --primary-color: #2b6cb0;
            --background-light: #f7fafc;
            --background-dark: #1a202c;
            --card-background-light: #fff;
            --card-background-dark: #2d3748;
            --text-light: #2d3748;
            --text-dark: #f7fafc;
            --transition-duration: 0.3s;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            line-height: 1.6;
            background: var(--background-light);
            color: var(--text-light);
            transition: background-color var(--transition-duration), color var(--transition-duration);
        }

        .dark-mode {
            background: var(--background-dark);
            color: var(--text-dark);
        }

        header {
            background: var(--primary-color);
            padding: 1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .nav-container {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            transition: background-color var(--transition-duration);
            font-weight: 500;
        }

        nav a:hover,
        nav a:focus {
            background: #2c5282;
            outline: none;
        }

        .current {
            background: #1e4a79;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .filter-container {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        select {
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            border: 2px solid #e2e8f0;
            background: var(--card-background-light);
            color: inherit;
            cursor: pointer;
            transition: border-color var(--transition-duration);
        }

        .dark-mode select {
            background: var(--card-background-dark);
            border-color: #4a5568;
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            padding: 1rem;
        }

        .subject-card {
            background: var(--card-background-light);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: transform var(--transition-duration), box-shadow var(--transition-duration);
            position: relative;
        }

        .dark-mode .subject-card {
            background: var(--card-background-dark);
        }

        .subject-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.1);
        }

        .resource-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            background: var(--primary-color);
            color: white;
        }

        .error-message {
            color: #e53e3e;
            padding: 2rem;
            text-align: center;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                align-items: flex-start;
            }
            
            select {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
    </div>

    <header>
        <nav class="nav-container">
            <a href="/">Accueil</a>
            <a href="exams.html">Exams</a>
            <a href="stage.html">Stage</a>
            <a href="cuisine.html">Cuisine</a>
            <a href="cours.html" class="current">Cours</a>
            <a href="user.html">Profil</a>
        </nav>
        <button class="dark-mode-toggle" id="dark-mode-toggle" aria-label="Basculer le mode sombre">🌙</button>
    </header>

    <main>
        <h1>📚 Banque de Cours</h1>

        <div class="filter-container">
            <select id="yearFilter" aria-label="Filtrer par année">
                <option value="all">Toutes les années</option>
                <option value="A1">A1</option>
                <option value="A2">A2</option>
                <option value="A3">A3</option>
                <option value="A4">A4</option>
                <option value="A5">A5</option>
            </select>
            <select id="resourceTypeFilter" aria-label="Filtrer par type de ressource" style="display: none;">
                <option value="all">Tous les types</option>
            </select>
            <!-- Nouveau sélecteur pour les matières -->
            <select id="subjectFilter" aria-label="Filtrer par matière" style="display: none;">
                <option value="all">Toutes les matières</option>
            </select>
        </div>

        <div class="subjects-grid" id="subjectsGrid"></div>
        <div id="errorMessage" class="error-message"></div>
    </main>

    <script>
        (() => {
            // Configuration
            const RESOURCE_TYPES = ['TP', 'TD', 'Exos', 'Cours', 'Eval', 'Ressources'];
            const STORAGE_KEYS = {
                DARK_MODE: 'darkMode',
                SELECTED_YEAR: 'selectedYear',
                SELECTED_RESOURCE: 'selectedResource',
                SELECTED_SUBJECT: 'selectedSubject' // Nouvelle clé pour la matière
            };

            // Éléments DOM
            const dom = {
                loading: document.getElementById('loading'),
                darkModeToggle: document.getElementById('dark-mode-toggle'),
                yearFilter: document.getElementById('yearFilter'),
                resourceTypeFilter: document.getElementById('resourceTypeFilter'),
                subjectFilter: document.getElementById('subjectFilter'), // Nouvel élément
                subjectsGrid: document.getElementById('subjectsGrid'),
                errorMessage: document.getElementById('errorMessage')
            };

            // État global
            let state = {
                courses: [],
                selectedYear: 'A1',
                selectedResource: 'all',
                selectedSubject: 'all', // Nouvel état pour la matière
                isDarkMode: false
            };

            // Initialisation
            function init() {
                loadPreferences();
                setupEventListeners();
                loadCourses();
            }

            function loadPreferences() {
                state.isDarkMode = localStorage.getItem(STORAGE_KEYS.DARK_MODE) === 'true';
                state.selectedYear = localStorage.getItem(STORAGE_KEYS.SELECTED_YEAR) || 'all';
                state.selectedResource = localStorage.getItem(STORAGE_KEYS.SELECTED_RESOURCE) || 'all';
                state.selectedSubject = localStorage.getItem(STORAGE_KEYS.SELECTED_SUBJECT) || 'all'; // Charger la matière

                updateDarkMode();
                dom.yearFilter.value = state.selectedYear;
                dom.resourceTypeFilter.value = state.selectedResource;
                dom.subjectFilter.value = state.selectedSubject; // Appliquer la matière sélectionnée
            }

            function setupEventListeners() {
                dom.darkModeToggle.addEventListener('click', toggleDarkMode);
                dom.yearFilter.addEventListener('change', handleYearChange);
                dom.resourceTypeFilter.addEventListener('change', handleResourceChange);
                dom.subjectFilter.addEventListener('change', handleSubjectChange); // Nouvel écouteur
            }

            async function loadCourses() {
                showLoading();
                try {
                    const response = await fetch('cours/cours.json');
                    if (!response.ok) throw new Error('Erreur de chargement');
                    const data = await response.json();
                    state.courses = data.courses;
                    populateResourceTypes();
                    populateSubjects(); // Remplir les matières
                    updateUI();
                } catch (error) {
                    showError("Erreur de chargement des données. Veuillez réessayer plus tard.");
                } finally {
                    hideLoading();
                }
            }

            function populateResourceTypes() {
                dom.resourceTypeFilter.innerHTML = RESOURCE_TYPES
                    .map(type => `<option value="${type}">${type}</option>`)
                    .join('');
                dom.resourceTypeFilter.style.display = 'block';
            }

            function populateSubjects() {
                const subjects = [...new Set(state.courses.map(course => course.subject))]; // Extraire les matières uniques
                dom.subjectFilter.innerHTML = `
                    <option value="all">Toutes les matières</option>
                    ${subjects.map(subject => `<option value="${subject}">${subject}</option>`).join('')}
                `;
                dom.subjectFilter.style.display = 'block'; // Afficher le sélecteur
            }

            function updateUI() {
                const filteredCourses = state.courses.filter(course => 
                    (state.selectedYear === 'all' || course.year === state.selectedYear) && // Filtre par année
                    (state.selectedResource === 'all' || course.type === state.selectedResource) && // Filtre par type de ressource
                    (state.selectedSubject === 'all' || course.subject === state.selectedSubject) // Filtre par matière
                );
            
                dom.subjectsGrid.innerHTML = filteredCourses.length > 0 
                    ? filteredCourses.map(createCourseCard).join('')
                    : '<p class="error-message">Aucune ressource disponible pour ces critères</p>';
            }

            function createCourseCard(course) {
                return `
                    <div class="subject-card">
                        <span class="resource-badge">${course.type}</span>
                        <h3>${course.subject}</h3>
                        <p>${course.title || ''}</p> 
                        <p>${course.description || ''}</p>
                        <a href="${course.file}" 
                           target="_blank" 
                           class="download-link"
                           download
                           aria-label="Télécharger ${course.title}">
                            📂 Télécharger
                        </a>
                    </div>
                `;
            }

            function toggleDarkMode() {
                state.isDarkMode = !state.isDarkMode;
                updateDarkMode();
                localStorage.setItem(STORAGE_KEYS.DARK_MODE, state.isDarkMode);
            }

            function updateDarkMode() {
                document.body.classList.toggle('dark-mode', state.isDarkMode);
                dom.darkModeToggle.textContent = state.isDarkMode ? '☀️' : '🌙';
            }

            function handleYearChange(e) {
                state.selectedYear = e.target.value;
                localStorage.setItem(STORAGE_KEYS.SELECTED_YEAR, state.selectedYear);
                updateUI();
            }

            function handleResourceChange(e) {
                state.selectedResource = e.target.value;
                localStorage.setItem(STORAGE_KEYS.SELECTED_RESOURCE, state.selectedResource);
                updateUI();
            }

            function handleSubjectChange(e) {
                state.selectedSubject = e.target.value;
                localStorage.setItem(STORAGE_KEYS.SELECTED_SUBJECT, state.selectedSubject);
                updateUI();
            }

            function showLoading() {
                dom.loading.style.display = 'flex';
            }

            function hideLoading() {
                dom.loading.style.display = 'none';
            }

            function showError(message) {
                dom.errorMessage.textContent = message;
                setTimeout(() => dom.errorMessage.textContent = '', 5000);
            }

            // Démarrage de l'application
            init();
        })();
    </script>
</body>
</html>
