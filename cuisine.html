<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuisine étudiante</title>
    <style>
        /* Reset CSS basique */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; line-height: 1.6; }

        /* Mode sombre */
        body.dark-mode {
            background: #1a202c;
            color: white;
        }

        .dark-mode header {
            background: #2d3748;
            color: white;
        }

        .dark-mode .card {
            background: #2d3748;
            border-color: #4a5568;
            color: white;
        }

        .dark-mode footer {
            background: #2d3748;
            color: white;
            text-align: center;
        }

        /* Bouton mode sombre */
        .dark-mode-toggle {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            color: inherit;
        }

        /* Styles communs */
        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            padding: 0; 
            background: #f7fafc;
            color: #1a202c;
        }
        
        /* Header */
        header {
            background: #2b6cb0;
            padding: 1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }
        
        nav a { 
            color: white; 
            text-decoration: none; 
            margin-right: 1.5rem; 
        }

        nav a:hover {
            background: #2c5282;
        }

        /* Filtres */
        .filtres {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 1rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }

        .filtres h3 {
            margin-bottom: 1rem;
            color: #2b6cb0;
        }

        .filtres form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            align-items: end;
        }

        .filtres label {
            font-weight: bold;
            color: #666;
        }

        .filtres select, .filtres button {
            padding: 0.5rem;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            font-size: 1rem;
        }

        .filtres button {
            background: #2b6cb0;
            color: white;
            cursor: pointer;
            border: none;
        }

        .filtres button:hover {
            background: #2c5282;
        }

        /* Conteneur des recettes */
        .recettes {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            gap: 2rem;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        }

        /* Carte recette */
        .recette-card {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s;
            background: white;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            cursor: pointer;
        }

        .recette-card:hover {
            transform: translateY(-3px);
        }

        .recette-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .recette-content {
            padding: 1.5rem;
        }

        .recette-content h2 {
            color: #2b6cb0;
            margin-bottom: 0.5rem;
            font-size: 1.25rem;
        }

        .meta-info {
            display: flex;
            gap: 1rem;
            font-size: 0.875rem;
            color: #666;
            margin-top: 0.5rem;
        }

        .difficulty {
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            background: #ebf8ff;
            color: #2b6cb0;
        }

        /* Modal (popup) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
            padding: 2rem 0;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            max-width: 800px;
            width: 90%;
            position: relative;
            margin: auto;
        }

        .modal-content h2 {
            margin-top: 0;
            color: #2b6cb0;
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 1.5rem;
            cursor: pointer;
            color: #2b6cb0;
            background: none;
            border: none;
            padding: 0.5rem;
        }

        .recipe-steps {
            list-style-position: inside;
            padding-left: 0;
        }

        .recipe-steps li {
            margin-bottom: 0.5rem;
            padding: 0.5rem;
            background: #f8fafc;
            border-radius: 4px;
        }

        .nutritional-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            margin: 1rem 0;
        }

        .nutrition-item {
            padding: 1rem;
            background: #f8fafc;
            border-radius: 4px;
            text-align: center;
        }

        .nutrition-item span {
            display: block;
            font-weight: bold;
            color: #2b6cb0;
        }

        .tips {
            background: #ebf8ff;
            padding: 1rem;
            border-radius: 4px;
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">← Retour</a>
            <span>🍳 Cuisine étudiante</span>
        </nav>
        <button class="dark-mode-toggle" id="dark-mode-toggle">🌙</button>
    </header>

    <!-- Section de filtrage -->
    <div class="filtres">
        <h3>Filtrer les recettes :</h3>
        <form id="filtre-form">
            <label for="type">Type de plat :</label>
            <select id="type" name="type">
                <option value="">Tous</option>
                <option value="entrée">Entrée</option>
                <option value="plat">Plat</option>
                <option value="dessert">Dessert</option>
            </select>

            <label for="cout">Coût :</label>
            <select id="cout" name="cout">
                <option value="">Tous</option>
                <option value="Faible">Faible</option>
                <option value="Moyen">Moyen</option>
                <option value="Élevé">Élevé</option>
            </select>

            <label for="temps">Temps total :</label>
            <select id="temps" name="temps">
                <option value="">Tous</option>
                <option value="30 min">30 min</option>
                <option value="1h">1h</option>
                <option value="1h30">1h30</option>
                <option value="2h">2h</option>
            </select>

            <label for="difficulte">Difficulté :</label>
            <select id="difficulte" name="difficulte">
                <option value="">Tous</option>
                <option value="Facile">Facile</option>
                <option value="Moyen">Moyen</option>
                <option value="Difficile">Difficile</option>
            </select>

            <button type="submit">Filtrer</button>
        </form>
    </div>

    <!-- Conteneur des recettes -->
    <div class="recettes" id="recettes-container"></div>

    <!-- Modal pour afficher la recette -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="close-btn" id="close-modal">&times;</button>
            <h2 id="modal-title"></h2>
            <p id="modal-description"></p>
            
            <div class="meta-info">
                <span id="modal-temps-total"></span>
                <span id="modal-difficulte"></span>
                <span id="modal-cout"></span>
                <span id="modal-portions"></span>
            </div>

            <div class="nutritional-info" id="modal-nutrition"></div>

            <h3>Ingrédients</h3>
            <ul id="modal-ingredients"></ul>

            <h3>Étapes</h3>
            <ol class="recipe-steps" id="modal-steps"></ol>

            <div class="tips">
                <h3>Conseils</h3>
                <ul id="modal-tips"></ul>
            </div>

            <p><strong>Conservation :</strong> <span id="modal-conservation"></span></p>
        </div>
    </div>

    <footer>
        <p>© 2024 - Partagez vos meilleures recettes !</p>
    </footer>

    <script>
        // Gestion du mode sombre
        const darkModeToggle = document.getElementById('dark-mode-toggle');
        const body = document.body;

        // Vérifier le cookie au chargement
        if (document.cookie.includes('darkMode=true')) {
            body.classList.add('dark-mode');
            darkModeToggle.textContent = '☀️';
        }

        // Basculer le mode sombre
        darkModeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-mode');
            const isDarkMode = body.classList.contains('dark-mode');
            darkModeToggle.textContent = isDarkMode ? '☀️' : '🌙';
            
            // Enregistrer dans un cookie (valide 30 jours)
            document.cookie = `darkMode=${isDarkMode}; path=/; max-age=${30 * 24 * 60 * 60}`;
        });

        document.addEventListener("DOMContentLoaded", function () {
            const container = document.getElementById("recettes-container");
            const modal = document.getElementById("modal");
            const closeModal = document.getElementById("close-modal");
            const filtreForm = document.getElementById("filtre-form");

            let recettes = []; // Stocker toutes les recettes

            // Charger les recettes depuis le fichier JSON
            fetch("cuisine/recettes.json")
                .then(response => response.json())
                .then(data => {
                    recettes = data;
                    afficherRecettes(recettes); // Afficher toutes les recettes au départ
                })
                .catch(error => console.error("Erreur lors du chargement des recettes:", error));

            // Fonction pour afficher les recettes
            function afficherRecettes(recettesAFiltrer) {
                container.innerHTML = ""; // Vider le conteneur
                recettesAFiltrer.forEach(recette => {
                    const card = document.createElement("article");
                    card.classList.add("recette-card");
                    card.innerHTML = `
                        <img src="https://korokira.github.io/AlexandrICAM_Revival/${recette.image}" alt="${recette.nom}" class="recette-image"> 
                        <div class="recette-content">
                            <h2>${recette.nom}</h2>
                            <p>${recette.description}</p>
                            <div class="meta-info">
                                <span>${recette.temps_total}</span>
                                <span class="difficulty">${recette.difficulte}</span>
                                <span>Pour ${recette.portions} pers.</span>
                                <span>${recette.type}</span> <!-- Ajout du type de plat -->
                            </div>
                        </div>
                    `;

                    card.addEventListener("click", () => {
                        // Remplir les informations de la modal (identique à avant)
                        // ...
                    });

                    container.appendChild(card);
                });
            }

            // Gestion du filtrage
            filtreForm.addEventListener("submit", function (event) {
                event.preventDefault(); // Empêcher le rechargement de la page

                const type = document.getElementById("type").value;
                const cout = document.getElementById("cout").value;
                const temps = document.getElementById("temps").value;
                const difficulte = document.getElementById("difficulte").value;

                const recettesFiltrees = recettes.filter(recette => {
                    return (
                        (type === "" || recette.type === type) &&
                        (cout === "" || recette.cout === cout) &&
                        (temps === "" || recette.temps_total === temps) &&
                        (difficulte === "" || recette.difficulte === difficulte)
                    );
                });

                afficherRecettes(recettesFiltrees); // Afficher les recettes filtrées
            });
        });
    </script>
</body>
</html>
